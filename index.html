function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function open(pw){
  var d=b64(PAYLOAD),salt=d.slice(0,16),iv=d.slice(16,32),mac=d.slice(32,64),ct=d.slice(64);
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  var bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},base,512));
  var mk=await crypto.subtle.importKey("raw",bits.slice(32),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
  var msg=new Uint8Array(iv.length+ct.length);msg.set(iv);msg.set(ct,iv.length);
  if(!await crypto.subtle.verify("HMAC",mk,mac,msg))throw new Error("bad");
  var ek=await crypto.subtle.importKey("raw",bits.slice(0,32),{name:"AES-CBC"},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:iv},ek,ct);
  return new TextDecoder().decode(pt);
}
async function run(pw,silent){
  var err=document.getElementById("err"),go=document.getElementById("go");
  err.textContent="";go.disabled=true;go.textContent="Åpner …";
  try{
    var html=await open(pw);
    
    document.open();document.write(html);document.close();
  }catch(e){
    sessionStorage.removeItem("sg-pw");
    go.disabled=false;go.textContent="Åpne";
    if(!silent){err.textContent="Feil passord. Prøv igjen.";document.getElementById("pw").select()}
  }
}
document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();run(document.getElementById("pw").value,false)});
sessionStorage.removeItem("sg-pw");
})();
